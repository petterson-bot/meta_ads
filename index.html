<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDA 2026 · Dashboard Realtime</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050A05;--sb:#0A120A;--c1:#0D170D;--c2:#121F12;--c3:#1A2D1A;--bd:#1A381A;--bd2:#256025;
--n:#4AE54A;--n2:#30B030;--n3:#1A7A1A;--r:#FF4444;--y:#FFD700;--o:#FF8C00;--b:#5BA8FF;--cy:#00E5CC;--p:#B57AFF;--pk:#FF6B9D;
--w:#FFF;--t1:#C8D8C8;--t2:#88A088;--t3:#506850}
body{background:var(--bg);color:var(--w);font-family:'Sora',sans-serif;display:flex;height:100vh;overflow:hidden}
.mono{font-family:'DM Mono',monospace}

/* SIDEBAR */
.sidebar{width:240px;min-width:240px;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.sb-logo{padding:16px;border-bottom:1px solid var(--bd);text-align:center}
.sb-logo h2{font-size:14px;font-weight:800;color:var(--n);letter-spacing:1px}
.sb-logo p{font-size:9px;color:var(--t3);margin-top:2px}
.sb-section{padding:8px 0}
.sb-label{font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);padding:8px 16px 4px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;transition:.15s;font-size:12px;color:var(--t2);font-weight:500;border-left:3px solid transparent}
.sb-item:hover{background:rgba(74,229,74,.04);color:var(--w)}
.sb-item.active{background:rgba(74,229,74,.08);color:var(--n);border-left-color:var(--n)}
.sb-item .icon{font-size:14px;width:20px;text-align:center}
.sb-divider{height:1px;background:var(--bd);margin:4px 12px}

/* STATUS DOT */
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-left:auto}
.dot.live{background:var(--n);box-shadow:0 0 6px var(--n);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:0}
.main::-webkit-scrollbar{width:6px}.main::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(8px)}
.search-box{flex:1;max-width:500px;position:relative}
.search-box input{width:100%;background:var(--c1);border:1px solid var(--bd);border-radius:8px;padding:8px 12px 8px 32px;color:var(--w);font-family:'Sora',sans-serif;font-size:12px;outline:none;transition:.2s}
.search-box input:focus{border-color:var(--n);box-shadow:0 0 0 2px rgba(74,229,74,.1)}
.search-box input::placeholder{color:var(--t3)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:12px}
.account-sel{display:flex;gap:4px}
.acc-btn{padding:5px 10px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid var(--bd);background:var(--c1);color:var(--t2);cursor:pointer;transition:.15s}
.acc-btn:hover{border-color:var(--n3)}.acc-btn.on{background:var(--n);color:var(--bg);border-color:var(--n)}
.refresh-btn{padding:5px 10px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid var(--bd);background:var(--c1);color:var(--n);cursor:pointer;transition:.15s}
.refresh-btn:hover{background:var(--n);color:var(--bg)}

/* CONTENT */
.content{padding:16px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:16px}
.kpi{background:var(--c1);border:1px solid var(--bd);border-radius:8px;padding:12px;text-align:center;transition:.2s}
.kpi:hover{border-color:var(--n3)}
.kpi .label{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--t3)}
.kpi .value{font-size:20px;font-weight:800;margin-top:2px}
.kpi .sub{font-size:8px;color:var(--t3);margin-top:1px}

.card{background:var(--c1);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:700;color:var(--n);margin-bottom:10px;padding-left:8px;border-left:3px solid var(--n)}
.chart-wrap{position:relative;height:300px;width:100%}
.chart-wrap.lg{height:380px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1000px){.grid-2{grid-template-columns:1fr}}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--c2);color:var(--n);padding:6px 8px;text-align:left;font-weight:700;white-space:nowrap;font-size:9px;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--bd2)}
td{padding:5px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr:nth-child(even){background:var(--c2)}tr:hover{background:rgba(74,229,74,.03)}

.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:8px;font-weight:700}
.tag-g{background:rgba(74,229,74,.1);color:var(--n)}.tag-r{background:rgba(255,68,68,.1);color:var(--r)}
.tag-y{background:rgba(255,215,0,.1);color:var(--y)}.tag-b{background:rgba(91,168,255,.1);color:var(--b)}
.tag-p{background:rgba(181,122,255,.1);color:var(--p)}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--t2);font-size:13px;gap:8px}
.spinner{width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--n);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* CONFIG PANEL */
.config-panel{background:var(--c1);border:1px solid var(--bd);border-radius:10px;padding:20px;margin-bottom:16px}
.config-panel label{font-size:11px;color:var(--t2);display:block;margin-bottom:4px;font-weight:600}
.config-panel input,.config-panel textarea{width:100%;background:var(--c2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;color:var(--w);font-family:'DM Mono',monospace;font-size:11px;margin-bottom:10px;outline:none}
.config-panel input:focus,.config-panel textarea:focus{border-color:var(--n)}
.config-panel button{background:var(--n);color:var(--bg);border:none;padding:8px 16px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer}

/* MOBILE */
@media(max-width:768px){
  .sidebar{width:56px;min-width:56px}
  .sb-logo h2,.sb-logo p,.sb-label,.sb-item span:not(.icon){display:none}
  .sb-item{padding:10px 0;justify-content:center}
  .sb-item .icon{width:auto}
  .topbar{padding:8px 12px}
  .content{padding:10px 12px}
  .chart-wrap{height:220px!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ===== CONFIG =====
const META_TOKEN = 'EAARxmUt4bAcBQgkDZBP9bsxJZCoU8jX60EpnbDmvON5elPvADLBP6gOGkeRUHDLRVvhNrIHF2ej74i7FQlCyU7YWgqM9Q8iwZCBiBZCB9KLisUq0L40NIYxfXuXfz8qt1ZCRjie2tYafH2NmrQk9XLdyoQuhJZA5M2w8GnQZAhijiAROADhgXxgMrsz5OSOsZCOZAE3x25F1BKbYT9hiBF1zk0yrOSskfkweZCSkuXvvdlvXBey3ZBB7PG7v9L5uDnxd4rtcZCcfgZAqCo1eUawjUXsNotcczpj8Dafh3QApZBe0ZCptHZAwLZCPisEBfXnUQYgxhtfZBF9oR9YJp6';
const ACCOUNTS = {
  'C04': 'act_377480853270622',
  'C03': 'act_629328937757745'
};
const META_API = 'https://graph.facebook.com/v21.0';

// ===== META API FETCH =====
async function metaFetch(endpoint, params = {}) {
  const url = new URL(`${META_API}/${endpoint}`);
  url.searchParams.set('access_token', META_TOKEN);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, typeof v === 'object' ? JSON.stringify(v) : v));
  try {
    const res = await fetch(url.toString());
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data;
  } catch (e) {
    console.error('Meta API Error:', e);
    return { error: e.message, data: [] };
  }
}

async function fetchCampaigns(accountId) {
  return metaFetch(`${accountId}/campaigns`, {
    fields: 'id,name,status,objective,daily_budget,lifetime_budget',
    limit: 100,
    effective_status: '["ACTIVE","PAUSED"]'
  });
}

async function fetchCampaignInsights(campaignId, datePreset = 'last_30d') {
  return metaFetch(`${campaignId}/insights`, {
    fields: 'campaign_name,impressions,clicks,spend,reach,cpc,cpm,ctr,actions,cost_per_action_type',
    date_preset: datePreset
  });
}

async function fetchAdsets(accountId) {
  return metaFetch(`${accountId}/adsets`, {
    fields: 'id,name,status,campaign{name},daily_budget,optimization_goal',
    limit: 200,
    effective_status: '["ACTIVE","PAUSED"]'
  });
}

async function fetchAdsetInsights(adsetId, datePreset = 'last_30d') {
  return metaFetch(`${adsetId}/insights`, {
    fields: 'adset_name,impressions,clicks,spend,reach,cpc,cpm,ctr,actions,cost_per_action_type',
    date_preset: datePreset
  });
}

async function fetchAds(accountId) {
  return metaFetch(`${accountId}/ads`, {
    fields: 'id,name,status,adset{name},campaign{name},creative{thumbnail_url}',
    limit: 300,
    effective_status: '["ACTIVE","PAUSED"]'
  });
}

async function fetchAdInsights(adId, datePreset = 'last_30d') {
  return metaFetch(`${adId}/insights`, {
    fields: 'ad_name,impressions,clicks,spend,reach,cpc,cpm,ctr,actions,cost_per_action_type',
    date_preset: datePreset
  });
}

async function fetchAccountInsights(accountId, datePreset = 'last_30d') {
  return metaFetch(`${accountId}/insights`, {
    fields: 'impressions,clicks,spend,reach,cpc,cpm,ctr,actions,cost_per_action_type',
    date_preset: datePreset
  });
}

// ===== HELPERS =====
function extractAction(actions, type) {
  if (!actions) return 0;
  const a = actions.find(a => a.action_type === type);
  return a ? parseInt(a.value) : 0;
}
function extractCPA(costPerAction, type) {
  if (!costPerAction) return 0;
  const a = costPerAction.find(a => a.action_type === type);
  return a ? parseFloat(a.value) : 0;
}
function fmt(n) { return n ? parseFloat(n).toLocaleString('pt-BR', {minimumFractionDigits: 0, maximumFractionDigits: 0}) : '0'; }
function fmtR(n) { return 'R$ ' + fmt(n); }
function fmtD(n) { return n ? parseFloat(n).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '0,00'; }

// ===== APP =====
function App() {
  const [page, setPage] = useState('dashboard');
  const [account, setAccount] = useState('C04');
  const [loading, setLoading] = useState(false);
  const [search, setSearch] = useState('');
  const [datePreset, setDatePreset] = useState('last_30d');
  
  // Data states
  const [accountData, setAccountData] = useState(null);
  const [campaigns, setCampaigns] = useState([]);
  const [campaignInsights, setCampaignInsights] = useState({});
  const [adsets, setAdsets] = useState([]);
  const [ads, setAds] = useState([]);
  const [selectedItem, setSelectedItem] = useState(null);
  const [selectedInsights, setSelectedInsights] = useState(null);
  
  // Spreadsheet config
  const [sheetUrl, setSheetUrl] = useState(localStorage.getItem('sda_sheet_url') || '');
  const [sheetData, setSheetData] = useState(null);
  
  // ===== LOAD DATA =====
  const loadData = useCallback(async () => {
    setLoading(true);
    try {
      const accId = ACCOUNTS[account];
      
      // Account insights
      const accInsights = await fetchAccountInsights(accId, datePreset);
      setAccountData(accInsights.data?.[0] || null);
      
      // Campaigns
      const campsRes = await fetchCampaigns(accId);
      const camps = campsRes.data || [];
      setCampaigns(camps);
      
      // Fetch insights for each campaign
      const insights = {};
      for (const c of camps.slice(0, 25)) {
        const ci = await fetchCampaignInsights(c.id, datePreset);
        if (ci.data?.[0]) insights[c.id] = ci.data[0];
      }
      setCampaignInsights(insights);
      
      // Adsets
      const adsetsRes = await fetchAdsets(accId);
      setAdsets(adsetsRes.data || []);
      
      // Ads
      const adsRes = await fetchAds(accId);
      setAds(adsRes.data || []);
      
    } catch(e) {
      console.error(e);
    }
    setLoading(false);
  }, [account, datePreset]);
  
  const loadSheet = useCallback(async () => {
    if (!sheetUrl) return;
    try {
      const res = await fetch(sheetUrl + '?action=all');
      const data = await res.json();
      setSheetData(data);
    } catch(e) {
      console.error('Sheet error:', e);
    }
  }, [sheetUrl]);
  
  useEffect(() => { loadData(); }, [loadData]);
  useEffect(() => { if(sheetUrl) loadSheet(); }, [loadSheet]);
  
  // ===== DETAIL VIEW =====
  const viewDetails = async (type, id) => {
    setSelectedItem({ type, id });
    setLoading(true);
    let insights;
    if (type === 'campaign') insights = await fetchCampaignInsights(id, datePreset);
    else if (type === 'adset') insights = await fetchAdsetInsights(id, datePreset);
    else if (type === 'ad') insights = await fetchAdInsights(id, datePreset);
    setSelectedInsights(insights?.data?.[0] || null);
    setLoading(false);
    setPage('detail');
  };
  
  // ===== FILTERED DATA =====
  const filteredCampaigns = campaigns.filter(c => !search || c.name.toLowerCase().includes(search.toLowerCase()));
  const filteredAdsets = adsets.filter(a => !search || a.name.toLowerCase().includes(search.toLowerCase()));
  const filteredAds = ads.filter(a => !search || a.name.toLowerCase().includes(search.toLowerCase()));
  
  // ===== SIDEBAR =====
  const menuItems = [
    { id: 'dashboard', icon: '📊', label: 'Dashboard' },
    { id: 'campaigns', icon: '🎯', label: 'Campanhas' },
    { id: 'adsets', icon: '📦', label: 'Conjuntos' },
    { id: 'ads', icon: '📄', label: 'Anúncios' },
    { id: 'vendas', icon: '💰', label: 'Vendas' },
    { id: 'closers', icon: '👥', label: 'Closers' },
    { id: 'config', icon: '⚙️', label: 'Configurar' },
  ];
  
  return (
    <>
      {/* SIDEBAR */}
      <div className="sidebar">
        <div className="sb-logo">
          <h2>SDA 2026</h2>
          <p>Dashboard Realtime</p>
        </div>
        <div className="sb-section">
          <div className="sb-label">Meta Ads</div>
          {menuItems.slice(0, 4).map(m => (
            <div key={m.id} className={`sb-item ${page === m.id ? 'active' : ''}`} onClick={() => {setPage(m.id); setSelectedItem(null)}}>
              <span className="icon">{m.icon}</span>
              <span>{m.label}</span>
              {m.id === 'dashboard' && <span className="dot live"></span>}
            </div>
          ))}
        </div>
        <div className="sb-divider"></div>
        <div className="sb-section">
          <div className="sb-label">Comercial</div>
          {menuItems.slice(4, 6).map(m => (
            <div key={m.id} className={`sb-item ${page === m.id ? 'active' : ''}`} onClick={() => setPage(m.id)}>
              <span className="icon">{m.icon}</span>
              <span>{m.label}</span>
            </div>
          ))}
        </div>
        <div className="sb-divider"></div>
        <div className="sb-section">
          <div className="sb-label">Sistema</div>
          <div className={`sb-item ${page === 'config' ? 'active' : ''}`} onClick={() => setPage('config')}>
            <span className="icon">⚙️</span>
            <span>Configurar</span>
          </div>
        </div>
      </div>
      
      {/* MAIN */}
      <div className="main">
        {/* TOPBAR */}
        <div className="topbar">
          <div className="search-box">
            <span className="search-icon">🔍</span>
            <input placeholder="Buscar campanha, conjunto ou anúncio..." value={search} onChange={e => setSearch(e.target.value)} />
          </div>
          <div className="account-sel">
            {Object.keys(ACCOUNTS).map(a => (
              <button key={a} className={`acc-btn ${account === a ? 'on' : ''}`} onClick={() => setAccount(a)}>{a}</button>
            ))}
          </div>
          <select className="acc-btn" value={datePreset} onChange={e => setDatePreset(e.target.value)} style={{cursor:'pointer'}}>
            <option value="today">Hoje</option>
            <option value="yesterday">Ontem</option>
            <option value="last_7d">7 dias</option>
            <option value="last_14d">14 dias</option>
            <option value="last_30d">30 dias</option>
            <option value="this_month">Este mês</option>
            <option value="last_month">Mês passado</option>
          </select>
          <button className="refresh-btn" onClick={loadData}>🔄 Atualizar</button>
        </div>
        
        <div className="content">
          {loading && <div className="loading"><div className="spinner"></div> Carregando dados da API...</div>}
          
          {/* DASHBOARD */}
          {page === 'dashboard' && accountData && !loading && (
            <DashboardPage data={accountData} campaigns={campaigns} insights={campaignInsights} sheet={sheetData} />
          )}
          
          {/* CAMPAIGNS */}
          {page === 'campaigns' && !loading && (
            <CampaignsPage campaigns={filteredCampaigns} insights={campaignInsights} onView={(id) => viewDetails('campaign', id)} />
          )}
          
          {/* ADSETS */}
          {page === 'adsets' && !loading && (
            <AdsetsPage adsets={filteredAdsets} onView={(id) => viewDetails('adset', id)} />
          )}
          
          {/* ADS */}
          {page === 'ads' && !loading && (
            <AdsPage ads={filteredAds} onView={(id) => viewDetails('ad', id)} />
          )}
          
          {/* DETAIL */}
          {page === 'detail' && selectedInsights && !loading && (
            <DetailPage item={selectedItem} insights={selectedInsights} />
          )}
          
          {/* VENDAS */}
          {page === 'vendas' && (
            <VendasPage sheet={sheetData} onConfig={() => setPage('config')} />
          )}
          
          {/* CLOSERS */}
          {page === 'closers' && (
            <ClosersPage sheet={sheetData} onConfig={() => setPage('config')} />
          )}
          
          {/* CONFIG */}
          {page === 'config' && (
            <ConfigPage sheetUrl={sheetUrl} setSheetUrl={(u) => {setSheetUrl(u); localStorage.setItem('sda_sheet_url', u)}} onLoad={loadSheet} />
          )}
        </div>
      </div>
    </>
  );
}

// ===== DASHBOARD PAGE =====
function DashboardPage({ data, campaigns, insights, sheet }) {
  const spend = parseFloat(data.spend || 0);
  const impr = parseInt(data.impressions || 0);
  const clicks = parseInt(data.clicks || 0);
  const reach = parseInt(data.reach || 0);
  const cpc = parseFloat(data.cpc || 0);
  const ctr = parseFloat(data.ctr || 0);
  const leads = extractAction(data.actions, 'lead');
  const purchases = extractAction(data.actions, 'purchase');
  const checkouts = extractAction(data.actions, 'initiate_checkout');
  
  const resumo = sheet?.resumo;
  
  return (
    <>
      <div className="kpis">
        <div className="kpi"><div className="label">Gasto</div><div className="value" style={{color:'var(--r)'}}>{fmtR(spend)}</div><div className="sub">período selecionado</div></div>
        <div className="kpi"><div className="label">Impressões</div><div className="value" style={{color:'var(--b)'}}>{fmt(impr)}</div><div className="sub">Alcance: {fmt(reach)}</div></div>
        <div className="kpi"><div className="label">Cliques</div><div className="value" style={{color:'var(--cy)'}}>{fmt(clicks)}</div><div className="sub">CTR: {fmtD(ctr)}%</div></div>
        <div className="kpi"><div className="label">CPC</div><div className="value" style={{color:'var(--y)'}}>{fmtR(cpc)}</div></div>
        <div className="kpi"><div className="label">Leads</div><div className="value" style={{color:'var(--n)'}}>{fmt(leads)}</div><div className="sub">CPL: {leads > 0 ? fmtR(spend/leads) : '-'}</div></div>
        <div className="kpi"><div className="label">Compras Pixel</div><div className="value" style={{color:'var(--p)'}}>{fmt(purchases)}</div><div className="sub">CPA: {purchases > 0 ? fmtR(spend/purchases) : '-'}</div></div>
        {resumo && <div className="kpi"><div className="label">Vendas Reais</div><div className="value" style={{color:'var(--n)'}}>{fmt(resumo.totalVendas)}</div><div className="sub">{fmtR(resumo.totalReceita)}</div></div>}
        {resumo && <div className="kpi"><div className="label">ROAS Real</div><div className="value" style={{color:'var(--y)'}}>{(resumo.totalReceita / spend).toFixed(2)}x</div></div>}
      </div>
      
      <div className="card">
        <div className="card-title">Campanhas Ativas — Performance</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Campanha</th><th>Status</th><th>Gasto</th><th>Impr</th><th>Clicks</th><th>CTR</th><th>CPC</th><th>Leads</th><th>Compras</th></tr></thead>
            <tbody>
              {campaigns.filter(c => c.status === 'ACTIVE').map(c => {
                const ci = insights[c.id];
                return (

// ===== DETAIL PAGE =====
function DetailPage({ item, insights }) {
  if (!insights) return <div className="loading">Sem dados para este período</div>;
  const d = insights;
  const spend = parseFloat(d.spend || 0);
  const leads = extractAction(d.actions, 'lead');
  const purchases = extractAction(d.actions, 'purchase');
  const checkouts = extractAction(d.actions, 'initiate_checkout');
  const linkClicks = extractAction(d.actions, 'link_click');
  const lpViews = extractAction(d.actions, 'landing_page_view');
  
  return (
    <>
      <div className="card-title" style={{marginBottom:12}}>🔍 Detalhes: {d.campaign_name || d.adset_name || d.ad_name}</div>
      <div className="kpis">
        <div className="kpi"><div className="label">Gasto</div><div className="value" style={{color:'var(--r)'}}>{fmtR(spend)}</div></div>
        <div className="kpi"><div className="label">Impressões</div><div className="value" style={{color:'var(--b)'}}>{fmt(d.impressions)}</div></div>
        <div className="kpi"><div className="label">Cliques</div><div className="value" style={{color:'var(--cy)'}}>{fmt(d.clicks)}</div></div>
        <div className="kpi"><div className="label">CTR</div><div className="value" style={{color:'var(--y)'}}>{fmtD(d.ctr)}%</div></div>
        <div className="kpi"><div className="label">CPC</div><div className="value" style={{color:'var(--o)'}}>{fmtR(d.cpc)}</div></div>
        <div className="kpi"><div className="label">CPM</div><div className="value" style={{color:'var(--p)'}}>{fmtR(d.cpm)}</div></div>
        <div className="kpi"><div className="label">Link Clicks</div><div className="value" style={{color:'var(--n)'}}>{fmt(linkClicks)}</div></div>
        <div className="kpi"><div className="label">LP Views</div><div className="value" style={{color:'var(--cy)'}}>{fmt(lpViews)}</div></div>
        <div className="kpi"><div className="label">Leads</div><div className="value" style={{color:'var(--y)'}}>{fmt(leads)}</div><div className="sub">CPL: {leads>0?fmtR(spend/leads):'-'}</div></div>
        <div className="kpi"><div className="label">Checkouts</div><div className="value" style={{color:'var(--p)'}}>{fmt(checkouts)}</div></div>
        <div className="kpi"><div className="label">Compras</div><div className="value" style={{color:'var(--n)'}}>{fmt(purchases)}</div><div className="sub">CPA: {purchases>0?fmtR(spend/purchases):'-'}</div></div>
        <div className="kpi"><div className="label">Alcance</div><div className="value" style={{color:'var(--b)'}}>{fmt(d.reach)}</div></div>
      </div>
      
      {d.actions && (
        <div className="card">
          <div className="card-title">Todas as Ações</div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Tipo</th><th>Quantidade</th><th>CPA</th></tr></thead>
              <tbody>
                {d.actions.filter(a => parseInt(a.value) > 0).sort((a,b) => parseInt(b.value) - parseInt(a.value)).map((a, i) => (
                  <tr key={i}>
                    <td>{a.action_type}</td>
                    <td className="mono">{fmt(a.value)}</td>
                    <td className="mono">{extractCPA(d.cost_per_action_type, a.action_type) > 0 ? fmtR(extractCPA(d.cost_per_action_type, a.action_type)) : '-'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </>
  );
}

        {resumo?.canais?.['TRÁFEGO'] && <div className="kpi"><div className="label">Tráfego</div><div className="value" style={{color:'var(--b)'}}>{fmt(resumo.canais['TRÁFEGO'].qty)}</div><div className="sub">{fmtR(resumo.canais['TRÁFEGO'].rev)}</div></div>}

      {canais && (

          <div className="table-wrap">
            <table>
              <thead><tr><th>Canal</th><th>Categoria</th><th>Vendas</th><th>Receita</th></tr></thead>
              <tbody>
                {canais.slice(0, 20).map((c, i) => (
                  <tr key={i}>
                    <td>{c.nome}</td>
                    <td><span className={`tag ${c.canal==='COMERCIAL'?'tag-p':c.canal==='TRÁFEGO'?'tag-b':'tag-g'}`}>{c.canal}</span></td>
                    <td className="mono">{c.vendas}</td>
                    <td className="mono">{fmtR(c.receita)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      
      {lotes && (
        <div className="card">
          <div className="card-title">Vendas por Lote</div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Lote</th><th>Vendas</th><th>Receita</th><th>Comercial</th><th>Orgânico</th><th>Tráfego</th></tr></thead>
              <tbody>
                {lotes.map((l, i) => (
                  <tr key={i}>
                    <td>{l.lote}</td>
                    <td className="mono">{l.vendas}</td>
                    <td className="mono">{fmtR(l.receita)}</td>
                    <td className="mono">{fmtR(l.comercial)}</td>
                    <td className="mono">{fmtR(l.organico)}</td>
                    <td className="mono">{fmtR(l.trafego)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </>
  );
}
