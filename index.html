<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDA 2026 · Dashboard Realtime</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050A05;--sb:#0A120A;--c1:#0D170D;--c2:#121F12;--bd:#1A381A;--n:#4AE54A;--r:#FF4444;--y:#FFD700;--b:#5BA8FF;--w:#FFF;--t2:#88A088;--t3:#506850}
body{background:var(--bg);color:var(--w);font-family:'Sora',sans-serif;display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.sb-logo{padding:20px;border-bottom:1px solid var(--bd);text-align:center}
.sb-logo h2{font-size:14px;font-weight:800;color:var(--n);letter-spacing:1px}
.sb-item{padding:12px 20px;cursor:pointer;font-size:12px;color:var(--t2);transition:.2s;display:flex;align-items:center;gap:10px}
.sb-item.active{background:rgba(74,229,74,.08);color:var(--n);border-left:4px solid var(--n)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;sticky;top:0;z-index:100}
.acc-btn{padding:6px 12px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid var(--bd);background:var(--c1);color:var(--t2);cursor:pointer}
.acc-btn.on{background:var(--n);color:var(--bg);border-color:var(--n)}
.content{padding:20px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--c1);border:1px solid var(--bd);border-radius:10px;padding:16px;text-align:center}
.kpi .label{font-size:9px;text-transform:uppercase;color:var(--t3);letter-spacing:1px}
.kpi .value{font-size:20px;font-weight:800;margin-top:4px}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:12px;padding:20px}
.card-title{font-size:13px;font-weight:700;color:var(--n);margin-bottom:15px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:10px;color:var(--t3);font-size:9px;text-transform:uppercase;border-bottom:2px solid var(--bd)}
td{padding:12px 10px;border-bottom:1px solid var(--bd);color:var(--t2)}
tr:hover{background:rgba(74,229,74,0.02)}
.error-msg{background:rgba(255,68,68,0.1);border:1px solid var(--r);color:var(--r);padding:15px;border-radius:8px;margin-bottom:20px;font-size:12px}
.loading-box{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--t3)}
.spinner{width:24px;height:24px;border:3px solid var(--bd);border-top-color:var(--n);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const META_TOKEN = 'EAARxmUt4bAcBQgkDZBP9bsxJZCoU8jX60EpnbDmvON5elPvADLBP6gOGkeRUHDLRVvhNrIHF2ej74i7FQlCyU7YWgqM9Q8iwZCBiBZCB9KLisUq0L40NIYxfXuXfz8qt1ZCRjie2tYafH2NmrQk9XLdyoQuhJZA5M2w8GnQZAhijiAROADhgXxgMrsz5OSOsZCOZAE3x25F1BKbYT9hiBF1zk0yrOSskfkweZCSkuXvvdlvXBey3ZBB7PG7v9L5uDnxd4rtcZCcfgZAqCo1eUawjUXsNotcczpj8Dafh3QApZBe0ZCptHZAwLZCPisEBfXnUQYgxhtfZBF9oR9YJp6';
const ACCOUNTS = { 'C04': 'act_377480853270622', 'C03': 'act_629328937757745' };
const API_BASE = 'https://graph.facebook.com/v21.0';

function App() {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [account, setAccount] = useState('C04');
  const [campaigns, setCampaigns] = useState([]);
  const [summary, setSummary] = useState(null);

  const loadData = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const accId = ACCOUNTS[account];
      
      // 1. Buscar Resumo da Conta
      const resSum = await fetch(`${API_BASE}/${accId}/insights?fields=spend,impressions,clicks,ctr&date_preset=last_30d&access_token=${META_TOKEN}`);
      const dataSum = await resSum.json();
      if (dataSum.error) throw new Error(dataSum.error.message);
      setSummary(dataSum.data[0] || null);

      // 2. Buscar Campanhas
      const resCamp = await fetch(`${API_BASE}/${accId}/campaigns?fields=name,status,objective&limit=25&access_token=${META_TOKEN}`);
      const dataCamp = await resCamp.json();
      if (dataCamp.error) throw new Error(dataCamp.error.message);

      // 3. Buscar Insights detalhados por campanha
      const enriched = await Promise.all(dataCamp.data.map(async (c) => {
        const resIns = await fetch(`${API_BASE}/${c.id}/insights?fields=spend,clicks,actions&date_preset=last_30d&access_token=${META_TOKEN}`);
        const dataIns = await resIns.json();
        return { ...c, insights: dataIns.data?.[0] || null };
      }));

      setCampaigns(enriched);
    } catch (e) {
      console.error("Erro na carga:", e);
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [account]);

  useEffect(() => { loadData(); }, [loadData]);

  return (
    <>
      <div className="sidebar">
        <div className="sb-logo"><h2>SDA 2026</h2></div>
        <div className="sb-item active">📊 Dashboard Meta</div>
        <div className="sb-item" style={{opacity:0.5}}>💰 Vendas (Planilha)</div>
        <div className="sb-item" style={{opacity:0.5}}>⚙️ Configurações</div>
      </div>

      <div className="main">
        <div className="topbar">
          {Object.keys(ACCOUNTS).map(a => (
            <button key={a} className={`acc-btn ${account === a ? 'on' : ''}`} onClick={() => setAccount(a)}>{a}</button>
          ))}
          <button className="acc-btn" onClick={loadData} style={{marginLeft:'auto', color:'var(--n)'}}>🔄 Atualizar Dados</button>
        </div>

        <div className="content">
          {error && <div className="error-msg"><strong>Erro de Conexão:</strong> {error}</div>}

          {loading ? (
            <div className="loading-box"><div className="spinner"></div>Sincronizando com Perry Marketing...</div>
          ) : (
            <>
              <div className="kpis">
                <div className="kpi">
                  <div className="label">Investimento (30d)</div>
                  <div className="value" style={{color:'var(--r)'}}>R$ {parseFloat(summary?.spend || 0).toLocaleString('pt-BR')}</div>
                </div>
                <div className="kpi">
                  <div className="label">Cliques Totais</div>
                  <div className="value">{summary?.clicks || 0}</div>
                </div>
                <div className="kpi">
                  <div className="label">CTR Médio</div>
                  <div className="value" style={{color:'var(--y)'}}>{parseFloat(summary?.ctr || 0).toFixed(2)}%</div>
                </div>
                <div className="kpi">
                  <div className="label">Campanhas Listadas</div>
                  <div className="value" style={{color:'var(--b)'}}>{campaigns.length}</div>
                </div>
              </div>

              <div className="card">
                <div className="card-title">Performance por Campanha</div>
                <table>
                  <thead>
                    <tr>
                      <th>Nome da Campanha</th>
                      <th>Status</th>
                      <th>Gasto</th>
                      <th>Cliques</th>
                    </tr>
                  </thead>
                  <tbody>
                    {campaigns.length === 0 ? (
                      <tr><td colSpan="4" style={{textAlign:'center', padding:'40px'}}>Nenhuma campanha encontrada nesta conta.</td></tr>
                    ) : (
                      campaigns.map(c => (
                        <tr key={c.id}>
                          <td style={{color:'var(--w)', fontWeight:'600'}}>{c.name}</td>
                          <td>{c.status === 'ACTIVE' ? '🟢 Ativa' : '⚪ Pausada'}</td>
                          <td className="mono">R$ {parseFloat(c.insights?.spend || 0).toFixed(2)}</td>
                          <td className="mono">{c.insights?.clicks || 0}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </>
          )}
        </div>
      </div>
    </>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
